# Base compose: mandatory infrastructure (nginx, db, app-main).
# Always started. Overlays in compose/ add optional services.

name: "${PROJECT_PREFIX:-dwe}-${PROJECT_NAME:-laravel}"

# No per-service `container_name:` here or in the overlays under compose/, and
# that is deliberate. The pins used to spell out `dwe-laravel-<svc>` to avoid
# compose's `-1` suffix, but dwe's per-service commands (`logs`, `shell`,
# `stop`, `restart`) resolve a container through the compose project+service
# LABELS and never guess that name — so the pins bought nothing dwe needed,
# while the `dwe test` isolation scanner blocks on them precisely because a
# fixed name does not move with the disposable copy's own compose project.
# Containers are `<project>-<service>-1`, e.g. `dwe-laravel-app-main-1`.
#
# A raw `docker compose` run from this directory does not invent a second stack
# either: since dwe 0.6.0 the generated `.env` carries the reserved
# `COMPOSE_PROJECT_NAME=dwe-laravel`, and `.env` sits beside this file in the
# compose project directory, so compose reads it and lands in the same project
# the `name:` above declares.
#
# The generated services/main/.devcontainer/devcontainer.json points here too, and
# it always attaches by compose SERVICE name, never by container name — so it is
# unaffected either way. Which service depends on the toggles: with the defaults it
# lists this file alone and attaches to `app-main`; enable `main-debug` and
# `dwe render ide main` re-renders that same hub file for the debug variant
# (`service: app-main-debug`, plus `compose/services/main/debug.yml`), because the
# template ranges over the service's own `compose:` list. Note also that a client
# passing its own `--project-name` outranks both `.env` and the `name:` above, so
# do not read the paragraph above as an explanation of what VS Code does.
#
# A bare `docker compose` here does see only this file and not the enabled
# overlays, so `dwe` remains the way to drive the whole stack.

volumes:
  db:
  composer_cache:
    external: true
    name: dwe_composer_cache
  # Per-service named volume for VS Code Server data. Lives outside Docker
  # Desktop's `fakeowner` bind-mount FS, which corrupts files created with
  # mode 0400 (umask 377) — the exact pattern Dev Containers uses for the
  # connection-token handshake. Without this, attaching a dev container to
  # app-main from VS Code on Docker Desktop fails with `echo: I/O error`.
  vscode_server_main:

services:
  nginx:
    image: "${IMAGE_NGINX:-nginx:latest}"
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./services/main/src:/workspace/src:ro
      - ./configs/nginx/conf/common/fastcgi.conf:/etc/nginx/conf.d/common/fastcgi.conf:ro
      - ./configs/nginx/templates/common/backend.conf.template:/etc/nginx/templates/backend.conf.template:ro
      - ./configs/nginx/templates/services/main.conf.template:/etc/nginx/templates/main.conf.template:ro
    environment:
      APP_HOST: "${APP_HOST:-app.localhost}"
      XDEBUG_IDEKEY: "${XDEBUG_IDEKEY:-PHPSTORM}"
      DEBUG_BACKEND: "${DEBUG_BACKEND:-app-main}"
    depends_on:
      - app-main

  db:
    image: "${IMAGE_DB:-mariadb:lts}"
    hostname: db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 2s
      retries: 50
      start_period: 5s
    ports:
      - "${DB_PORT:-13306}:3306"
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-root}"

  app-main:
    build:
      context: images/services/main
      args:
        APP_UID: "${UID:-1000}"
        APP_GID: "${GID:-1000}"
    hostname: main
    restart: unless-stopped
    working_dir: /workspace/src
    extra_hosts:
      - host.docker.internal:host-gateway
      - "${APP_HOST:-app.localhost}:host-gateway"
    volumes:
      - ./services/main:/workspace
      - ./services/main/home:/home/www-data
      - vscode_server_main:/home/www-data/.vscode-server
      - ~/.ssh:/home/www-data/.ssh:ro
      - composer_cache:/home/www-data/.composer/cache
    environment:
      COMPOSER_CACHE_DIR: /home/www-data/.composer/cache
    env_file:
      - ./configs/env/default.env
    depends_on:
      db:
        condition: service_healthy
